name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9", node: "22" }
          - { os: ubuntu-latest, python: "3.13", node: "24" }
          - { os: macos-latest, python: "3.13", node: "24" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -r skills/qa-site-audit/scripts/requirements.txt -r skills/qa-standards/scripts/requirements.txt
      - name: Install Node packages
        run: npm ci
        working-directory: tests/node
      - name: Find Chrome
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "CHROME_PATH=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
          else
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi
      - name: Install ShellCheck (not on the macOS image)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Environment facts
        shell: bash
        run: |
          node --version; python3 --version; command -v python3; shellcheck --version | sed -n 2p
          "$CHROME_PATH" --version || true
          python3 -c "import socket, time; t = time.time(); socket.getfqdn('127.0.0.1'); print('host name lookup for 127.0.0.1: %.2f s' % (time.time() - t))"
      - name: Run every check
        env:
          QA_CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: tools/check.sh --strict
      - name: Keep the full check output when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/check-logs
          retention-days: 7
